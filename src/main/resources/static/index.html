<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Attendance System</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <style>
        table, th, td { border: 1px solid black; border-collapse: collapse; padding: 5px; text-align: center; }
        table { margin-bottom: 20px; }

        .student-photo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; margin-right: 8px; vertical-align: middle; }

        /* Absent students table container */
        .absent-table-container{ width: fit-content; max-width: 500px; margin-top: 20px; }
        /* Table style */
        #absentTable{ border-collapse: collapse; table-layout: fixed; width: 100%; }
        /* Cells */
        #absentTable th,
        #absentTable td{ border: 1px solid #ccc; padding: 8px 12px; text-align: left; }
        /* Name column width */
        #absentTable td:first-child{ width: 250px; }

        /* Button container */
        .button-container{ display: flex; justify-content: center; margin-top: 20px; }
        /* Save button */
        #saveBtn{ padding: 10px 25px; font-size: 16px; border-radius: 6px; border: none; background-color: #2d8cf0; color: white; cursor: pointer; width: auto; min-width: 150px; }
        /* Responsive behavior */
        @media (max-width:600px){ #saveBtn{ width: 100%; } }


        /* =====================
   CHECKBOX STYLE
===================== */
input[type="checkbox"]{
    width:18px;
    height:18px;
    transform:scale(1.2);
    cursor:pointer;
}

input[type="checkbox"]:checked{
    accent-color:#4f6df5;
}



<!--/* CARD STYLE SECTIONS */-->
section{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:25px;
    box-shadow:0 6px 20px rgba(0,0,0,0.15);
}

<!--/* TABLE STYLE */-->
table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:10px;
    overflow:hidden;
}


<!--/* ROW HOVER EFFECT */-->
tbody tr:hover{
    background:#f3f6ff;
    transition:0.3s;
}


<!--/* BUTTONS */-->
<!--button{-->
<!--    background:linear-gradient(45deg,#4facfe,#00f2fe);-->
<!--    border:none;-->
<!--    padding:12px 22px;-->
<!--    border-radius:8px;-->
<!--    color:white;-->
<!--    font-weight:bold;-->
<!--    cursor:pointer;-->
<!--    transition:0.3s;-->
<!--}-->

<!--/* BUTTON HOVER ANIMATION */-->
<!--button:hover{-->
<!--    transform:translateY(-3px);-->
<!--    box-shadow:0 5px 15px rgba(0,0,0,0.3);-->
<!--}-->

<!--/* SAVE BUTTON CENTER */-->
<!--.button-container{-->
<!--    display:flex;-->
<!--    justify-content:center;-->
<!--    margin-top:20px;-->
<!--}-->


#workingDays{
    font-weight:bold;
}


/* MOBILE RESPONSIVE */
@media(max-width:768px){

table{
font-size:12px;
}

button{
width:100%;
margin-top:10px;
}

}

    </style>
</head>
<body>
<h1>Smart Attendance System</h1>

<!-- Today's Date -->
<p id="date"></p>

<section>
<!-- Attendance Table -->
<h2>Mark Attendance</h2>
<table id="attendanceTable">
    <thead>
    <tr id="periodHeader">
        <th>Student Name</th>
    </tr>
    </thead>
    <tbody id="tableBody">
    </tbody>
</table>

<div class="button-container">
    <button id="saveBtn">Save Attendance</button>
</div>

</section>
<br>
<hr>

<!-- Monthly Attendance Report -->
<h2>Monthly Attendance Report</h2>

<label>Select Student:</label>
<select id="studentSelect"></select>

<label>Select Month:</label>
<select id="monthSelect">
    <option value="1">January</option>
    <option value="2">February</option>
    <option value="3">March</option>
    <option value="4">April</option>
    <option value="5">May</option>
    <option value="6">June</option>
    <option value="7">July</option>
    <option value="8">August</option>
    <option value="9">September</option>
    <option value="10">October</option>
    <option value="11">November</option>
    <option value="12">December</option>
</select>

<label>Year:</label>
<input type="number" id="yearInput" value="2026" min="2000" max="2100">

<button id="reportBtn">Generate Report</button>
<br><br>
<p id="workingDays"></p>
<!--<p id="attendancePercentage"></p>-->
<p id="attendancePercentage"></p>
<br><br>
<table id="reportTable">
    <thead id="reportHeader"></thead>
    <tbody id="reportBody"></tbody>
</table>

<hr>


<h2>Absent Students Report</h2>

<label>Select Date:</label>
<input type="date" id="absentDate">

<button onclick="loadAbsentStudents()">Show Absent Students</button>
<br><br>
<table border="1">
    <thead>
    <tr>
        <th>Student</th>
<!--        <th>Absent Periods</th>-->
<!--        <th>Attendance %</th>-->
    </tr>
    </thead>

    <tbody id="absentTableBody"></tbody>
</table>
<br><br><br>
<script src="attendance.js"></script>
<script>
    if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/service-worker.js')
    .then(function(reg){
    console.log("Service Worker Registered");
    });
    }
</script>
</body>
</html>
